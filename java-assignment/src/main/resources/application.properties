# Default locale when Accept-Language is missing (e.g. en, hi, nl)
app.default-locale=en

# Request body size limit (bytes); helps prevent DoS from oversized payloads
quarkus.http.limits.max-body-size=512000

# CORS: allow browser clients from these origins (comma-separated); empty = same-origin only
quarkus.http.cors.origins=
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,x-request-id,accept-language
quarkus.http.cors.exposed-headers=x-request-id,x-response-time-ms,x-message

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/quarkus_test
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api

# Swagger UI: http://localhost:8080/q/swagger-ui  |  OpenAPI JSON: http://localhost:8080/q/openapi
quarkus.swagger-ui.always-include=true

# Health (SmallRye): /q/health (combined), /q/health/live (liveness), /q/health/ready (readiness; includes DB)

# Metrics: Prometheus scrape endpoint at /q/metrics (when quarkus-micrometer-registry-prometheus is present)
quarkus.micrometer.export.prometheus.path=/q/metrics

# JSON logging: set to true in prod for structured logs (e.g. {"level":"INFO","message":"..."})
# quarkus.log.console.json=true