name: Java Assignment CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-package:
    name: Build, test & package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test and package (java-assignment)
        working-directory: ./java-assignment
        env:
          # Run without Docker: use H2 in-memory for both tests and build (CI has no PostgreSQL/DevServices).
          QUARKUS_DEV_SERVICES_ENABLED: "false"
          QUARKUS_DATASOURCE_DB_KIND: h2
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
          QUARKUS_DATASOURCE_USERNAME: sa
          QUARKUS_DATASOURCE_PASSWORD: ""
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean package -DskipTests=false

      - name: Upload JAR (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-app
          path: java-assignment/target/quarkus-app/
          if-no-files-found: warn

